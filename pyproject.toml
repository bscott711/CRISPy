[project]
name = "CRISPy"
version = "0.2.0"
description = "A multi-ASI CRISP autofocus plugin for pymmcore-gui"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic>=2.10",
    "psygnal>=0.12",
    "pymmcore-plus",
    "pymmcore-widgets",
    "qtpy",
]

[project.entry-points."pymmcore_gui.main_window_menu"]
"CRISPy" = "CRISPy.plugin:launch_crisp_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/CRISPy"]

[dependency-groups]
dev = [
    "mdformat>=0.7.22",
    "mdformat-gfm>=1.0.0",
    "mdformat-tables>=1.0.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Moved verbatim from pymmcore-gui (a35df08); these rules would need behaviour edits.
"src/CRISPy/spot/**" = ["BLE001", "S110", "SIM102", "ISC004", "PYI034", "N999"]
"tests/test_spot_focus.py" = ["RUF059"]
